spring.application.name=GraduationProject



# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.CharSet=UTF-8


# Google OAuth2 Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# Enable scheduled tasks
spring.task.scheduling.enabled=true
spring.task.scheduling.pool.size=2

# Analytics Configuration
analytics.clustering.enabled=true
analytics.clustering.k=4
analytics.rfm.update.cron=0 0 2 * * ?
analytics.clustering.cron=0 0 3 * * MON

# SePay Configuration
sepay.webhook.api-key=${SEPAY_API_KEY}
sepay.bank.account=${SEPAY_BANK_ACCOUNT}
sepay.bank.name=${SEPAY_BANK_NAME}
sepay.qr.base-url=https://qr.sepay.vn/img

# Google Gemini Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model.name=gemini-1.5-flash
gemini.max.tokens=1000
gemini.temperature=0.7

# Chatbot Configuration
chatbot.enabled=true
chatbot.max.history=10

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Cart Abandonment Email Configuration
cart.abandonment.email.enabled=true
cart.abandonment.email.delay.minutes=1
cart.abandonment.email.from=${MAIL_USERNAME}
cart.abandonment.email.subject=Your shopping cart is waiting for you!

