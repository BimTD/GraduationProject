<!DOCTYPE html>
<html   xmlns:th="http://www.thymeleaf.org"
        lang="en" class="light scroll-smooth group" data-layout="vertical" data-sidebar="light" data-sidebar-size="lg" data-mode="light" data-topbar="light" data-skin="default" data-navbar="sticky" data-content="fluid" dir="ltr">
<head th:replace="~{admin/fragments/head :: head('Quản lý nhà cung cấp')}"></head>

<body class="text-base bg-body-bg text-body font-public dark:text-zink-100 dark:bg-zink-800 group-data-[skin=bordered]:bg-body-bordered group-data-[skin=bordered]:dark:bg-zink-700">
<div class="group-data-[sidebar-size=sm]:min-h-sm group-data-[sidebar-size=sm]:relative">

    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/sidebar :: sidebar}" ></div>

    <div id="sidebar-overlay" class="absolute inset-0 z-[1002] bg-slate-500/30 hidden"></div>
    <!-- Header -->
    <header th:replace="~{admin/fragments/header :: header}"></header>

    <!-- Content -->
    <div class="group-data-[sidebar-size=lg]:ltr:md:ml-vertical-menu group-data-[sidebar-size=lg]:rtl:md:mr-vertical-menu group-data-[sidebar-size=md]:ltr:ml-vertical-menu-md group-data-[sidebar-size=md]:rtl:mr-vertical-menu-md group-data-[sidebar-size=sm]:ltr:ml-vertical-menu-sm group-data-[sidebar-size=sm]:rtl:mr-vertical-menu-sm pt-[calc(theme('spacing.header')_*_1)] pb-[calc(theme('spacing.header')_*_0.8)] px-4 group-data-[navbar=bordered]:pt-[calc(theme('spacing.header')_*_1.3)] group-data-[navbar=hidden]:pt-0 group-data-[layout=horizontal]:mx-auto group-data-[layout=horizontal]:max-w-screen-2xl group-data-[layout=horizontal]:px-0 group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:ltr:md:ml-auto group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:rtl:md:mr-auto group-data-[layout=horizontal]:md:pt-[calc(theme('spacing.header')_*_1.6)] group-data-[layout=horizontal]:px-3 group-data-[layout=horizontal]:group-data-[navbar=hidden]:pt-[calc(theme('spacing.header')_*_0.9)]">
        <div class="container-fluid group-data-[content=boxed]:max-w-boxed mx-auto">
            <div class="flex flex-col gap-2 py-4 md:flex-row md:items-center print:hidden">
                <div class="grow">
                    <h5 class="text-16">Nhà cung cấp</h5>
                </div>
                <ul class="flex items-center gap-2 text-sm font-normal shrink-0">
                    <li class="relative before:content-['\ea54'] before:font-remix ltr:before:-right-1 rtl:before:-left-1  before:absolute before:text-[18px] before:-top-[3px] ltr:pr-4 rtl:pl-4 before:text-slate-400 dark:text-zink-200">
                        <a href="#!" class="text-slate-400 dark:text-zink-200">Tổng quan</a>
                    </li>
                    <li class="text-slate-700 dark:text-zink-100">
                        Nhà cung cấp
                    </li>
                </ul>
            </div>
            <!-- Thông báo -->
            <div th:if="${success}" class="mb-4 p-3 rounded bg-green-100 text-green-800">[[${success}]]</div>
            <div th:if="${error}" class="mb-4 p-3 rounded bg-red-100 text-red-800">[[${error}]]</div>

            <div class="mb-4">
                <button class="btn bg-custom-500 text-white" onclick="window.location.href='?showForm=true'" th:if="${!showForm}"><i data-lucide="plus" class="size-4"></i>
                </button>
            </div>

            <div class="card mb-4" th:if="${showForm}">
                <div class="card-body">
                    <form th:action="@{${formAction}}" th:object="${supplier}" method="post" class="flex flex-col gap-4" id="supplierForm">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="hidden" th:field="*{id}" />
                            <div class="form-group">
                                <label class="block mb-1 required">Nhà cung cấp</label>
                                <input type="text" th:field="*{ten}" class="form-input border-slate-200" placeholder="Tên..." required />
                            </div>
                            <div class="form-group">
                                <label class="block mb-1 required">Số điện thoại</label>
                                <input type="text" th:field="*{sdt}" class="form-input border-slate-200" placeholder="Số điện thoại..." required />
                            </div>
                            <div class="form-group">
                                <label class="block mb-1 required">Địa chỉ</label>
                                <input type="text" th:field="*{diaChi}" class="form-input border-slate-200" placeholder="Địa chỉ..." required />
                            </div>
                            <div class="form-group">
                                <label class="block mb-1">Thông tin</label>
                                <input type="text" th:field="*{thongTin}" class="form-input border-slate-200" placeholder="Thông tin..." />
                            </div>
                        </div>
                        <div>
                            <button type="submit" class="btn bg-custom-500 text-white" th:text="${editMode} ? 'Cập nhật' : 'Thêm'"></button>
                            <a href="/admin/supplier" class="btn bg-gray-300 ml-2">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card" id="supplierListTable">
                <div class="card-body">
                    <div class="overflow-x-auto">
                        <table class="w-full whitespace-nowrap" id="supplierTable">
                            <thead class="ltr:text-left rtl:text-right bg-slate-100 dark:bg-zink-600">
                            <tr>
                                <th class="px-3.5 py-2.5 font-semibold border-b border-slate-200 dark:border-zink-500">STT</th>
                                <th class="px-3.5 py-2.5 font-semibold border-b border-slate-200 dark:border-zink-500">Tên</th>
                                <th class="px-3.5 py-2.5 font-semibold border-b border-slate-200 dark:border-zink-500">Số điện thoại</th>
                                <th class="px-3.5 py-2.5 font-semibold border-b border-slate-200 dark:border-zink-500">Địa chỉ</th>
                                <th class="px-3.5 py-2.5 font-semibold border-b border-slate-200 dark:border-zink-500">Thông tin</th>
                                <th class="px-3.5 py-2.5 font-semibold border-b border-slate-200 dark:border-zink-500">Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="supplier, iterStat : ${suppliers}">
                                <td class="px-3.5 py-2.5 border-y border-slate-200 dark:border-zink-500">
                                    <span th:text="${iterStat.index + 1}"></span>
                                </td>
                                <td class="px-3.5 py-2.5 border-y border-slate-200 dark:border-zink-500">
                                    <span th:text="${supplier.ten}"></span>
                                </td>
                                <td class="px-3.5 py-2.5 border-y border-slate-200 dark:border-zink-500">
                                    <span th:text="${supplier.sdt}"></span>
                                </td>
                                <td class="px-3.5 py-2.5 border-y border-slate-200 dark:border-zink-500">
                                    <span th:text="${supplier.diaChi}"></span>
                                </td>
                                <td class="px-3.5 py-2.5 border-y border-slate-200 dark:border-zink-500">
                                    <span th:text="${supplier.thongTin}"></span>
                                </td>
                                <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-y border-slate-200 dark:border-zink-500 Action">
                                    <div class="flex gap-3">
                                        <a th:href="@{'/admin/supplier/edit/' + ${supplier.id}}" class="flex items-center justify-center transition-all duration-150 ease-linear rounded-md size-8 edit-item-btn bg-slate-100 text-slate-500 hover:text-custom-500 hover:bg-custom-100 dark:bg-zink-600 dark:text-zink-200 dark:hover:bg-custom-500/20 dark:hover:text-custom-500"><i data-lucide="pencil" class="size-4"></i></a>
                                        <a th:href="@{'/admin/supplier/delete/' + ${supplier.id}}" onclick="return confirm('Are you sure you want to delete?');"  class="flex items-center justify-center w-8 h-8 rounded-md bg-red-100 text-red-600 hover:bg-red-600 hover:text-white transition-all duration-150"><i data-lucide="trash-2" class="size-4"></i></a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(suppliers)}">
                                <td colspan="6" class="text-center">Không có.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="flex flex-col items-center gap-4 px-4 mt-4 md:flex-row" id="pagination-element">
                        <div class="grow">
                            <p class="text-slate-500 dark:text-zink-200">
                                Hiển thị  <b th:text="${suppliers.size()}"></b> trong <b th:text="${totalElements}"></b> kết quả
                            </p>
                        </div>
                        <div class="flex items-center gap-2">
                            <form th:action="@{/admin/supplier}" method="get" class="flex items-center gap-2">
                                <input type="hidden" name="search" th:value="${search}" />
                                <input type="hidden" name="page" th:value="${page}" />

                                <div class="flex items-center gap-2">
                                    <label for="size" class="whitespace-nowrap">Số lượng mỗi trang:</label>
                                    <select name="size" id="size" class="form-input border-slate-200" onchange="this.form.submit()">
                                        <option th:value="5" th:selected="${size == 5}">5</option>
                                        <option th:value="10" th:selected="${size == 10}">10</option>
                                        <option th:value="20" th:selected="${size == 20}">20</option>
                                        <option th:value="50" th:selected="${size == 50}">50</option>
                                    </select>
                                </div>
                            </form>
                        </div>

                        <div class="col-sm-auto mt-sm-0">
                            <div class="flex gap-2 pagination-wrap justify-content-center">
                                <a th:href="@{/admin/supplier(page=${prevPage},size=${size},search=${search})}" th:classappend="${page == 0} ? 'disabled' : ''" class="inline-flex items-center justify-center bg-white dark:bg-zink-700 h-8 px-3 transition-all duration-150 ease-linear border rounded border-slate-200 dark:border-zink-500 text-slate-500 dark:text-zink-200 hover:text-custom-500 dark:hover:text-custom-500 hover:bg-custom-50 dark:hover:bg-custom-500/10 focus:bg-custom-50 dark:focus:bg-custom-500/10 focus:text-custom-500 dark:focus:text-custom-500 page-item pagination-prev">
                                    <i class="mr-1 size-4 rtl:rotate-180" data-lucide="chevron-left"></i> Trước
                                </a>
                                <ul class="flex flex-wrap items-center gap-2 pagination">
                                    <li th:each="i : ${#numbers.sequence(0, lastPage)}">
                                        <a th:href="@{/admin/supplier(page=${i},size=${size},search=${search})}"
                                           th:text="${i+1}"
                                           th:classappend="${i == page} ? 'active bg-custom-50 border-custom-50 text-custom-500' : ''"
                                           class="inline-flex items-center justify-center h-8 px-3 border rounded border-slate-200 dark:border-zink-500 text-slate-500 dark:text-zink-200 hover:text-custom-500 hover:bg-custom-50">
                                        </a>
                                    </li>
                                </ul>
                                <a th:href="@{/admin/supplier(page=${nextPage},size=${size},search=${search})}" th:classappend="${page+1 >= totalPages} ? 'disabled' : ''" class="inline-flex items-center justify-center bg-white dark:bg-zink-700 h-8 px-3 transition-all duration-150 ease-linear border rounded border-slate-200 dark:border-zink-500 text-slate-500 dark:text-zink-200 hover:text-custom-500 dark:hover:text-custom-500 hover:bg-custom-50 dark:hover:bg-custom-500/10 focus:bg-custom-50 dark:focus:bg-custom-500/10 focus:text-custom-500 dark:focus:text-custom-500 page-item pagination-next">
                                    Sau <i class="ml-1 size-4 rtl:rotate-180" data-lucide="chevron-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            <!-- container-fluid -->
        </div>
        <!-- End Content -->

    </div>

    <link rel="stylesheet" th:href="@{/css/supplier-validation.css}">
    <script th:src="@{/js/supplier-validation.js}"></script>
    <div th:replace="~{admin/fragments/script :: script}"></div>
</div>
</body>
</html>
