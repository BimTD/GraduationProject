<!DOCTYPE html>
<html   xmlns:th="http://www.thymeleaf.org"
        lang="en" class="light scroll-smooth group" data-layout="vertical" data-sidebar="light" data-sidebar-size="lg" data-mode="light" data-topbar="light" data-skin="default" data-navbar="sticky" data-content="fluid" dir="ltr">
<head th:replace="admin/fragments/head :: head('Product Management')"></head>

<body class="text-base bg-body-bg text-body font-public dark:text-zink-100 dark:bg-zink-800 group-data-[skin=bordered]:bg-body-bordered group-data-[skin=bordered]:dark:bg-zink-700">
<div class="group-data-[sidebar-size=sm]:min-h-sm group-data-[sidebar-size=sm]:relative">

    <!-- Sidebar -->
    <div th:replace="admin/fragments/sidebar :: sidebar" ></div>

    <div id="sidebar-overlay" class="absolute inset-0 z-[1002] bg-slate-500/30 hidden"></div>
    <!-- Header -->
    <header th:replace="admin/fragments/header :: header"></header>

    <!-- Content -->
    <div class="group-data-[sidebar-size=lg]:ltr:md:ml-vertical-menu group-data-[sidebar-size=lg]:rtl:md:mr-vertical-menu group-data-[sidebar-size=md]:ltr:ml-vertical-menu-md group-data-[sidebar-size=md]:rtl:mr-vertical-menu-md group-data-[sidebar-size=sm]:ltr:ml-vertical-menu-sm group-data-[sidebar-size=sm]:rtl:mr-vertical-menu-sm pt-[calc(theme('spacing.header')_*_1)] pb-[calc(theme('spacing.header')_*_0.8)] px-4 group-data-[navbar=bordered]:pt-[calc(theme('spacing.header')_*_1.3)] group-data-[navbar=hidden]:pt-0 group-data-[layout=horizontal]:mx-auto group-data-[layout=horizontal]:max-w-screen-2xl group-data-[layout=horizontal]:px-0 group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:ltr:md:ml-auto group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:rtl:md:mr-auto group-data-[layout=horizontal]:md:pt-[calc(theme('spacing.header')_*_1.6)] group-data-[layout=horizontal]:px-3 group-data-[layout=horizontal]:group-data-[navbar=hidden]:pt-[calc(theme('spacing.header')_*_0.9)]">
        <div class="container-fluid group-data-[content=boxed]:max-w-boxed mx-auto">

            <div class="flex flex-col gap-2 py-4 md:flex-row md:items-center print:hidden">
                <div class="grow">
                    <h5 class="text-16">Product Analytics</h5>
                </div>
                <ul class="flex items-center gap-2 text-sm font-normal shrink-0">
                    <li class="relative before:content-['\ea54'] before:font-remix ltr:before:-right-1 rtl:before:-left-1  before:absolute before:text-[18px] before:-top-[3px] ltr:pr-4 rtl:pl-4 before:text-slate-400 dark:text-zink-200">
                        <a href="#!" class="text-slate-400 dark:text-zink-200">Dashboards</a>
                    </li>
                    <li class="text-slate-700 dark:text-zink-100">
                        Product
                    </li>
                </ul>
            </div>
            <div >Create Product</div>
            <form class="bg-white rounded-lg shadow p-6 mt-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Cột trái -->
                    <div class="space-y-4">
                        <div class="grid  gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Name</label>
                                <input type="text" maxlength="20" class="form-input w-full" placeholder="Name">
                            </div>
                        </div>
                        <div class="grid  gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Selling Price</label>
                                <input type="text" maxlength="20" class="form-input w-full" placeholder="Selling Price">
                            </div>
                        </div>
                        <div class="grid  gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Import Price</label>
                                <input type="text" maxlength="20" class="form-input w-full" placeholder="Import Price">
                            </div>
                        </div>
                        <div class="grid  gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Promotion</label>
                                <input type="text" maxlength="20" class="form-input w-full" placeholder="Promotion">
                            </div>
                        </div>
                        <div class="grid gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Gender</label>
                                <select class="form-select w-full">
                                    <option>Nam</option>
                                    <option>Nu</option>
                                    <option>Phi gioi tinh</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Product Images</label>
                            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 flex flex-col items-center justify-center text-gray-400 text-sm h-40 cursor-pointer">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4a1 1 0 011-1h8a1 1 0 011 1v12m-4 4h-4a1 1 0 01-1-1v-4h6v4a1 1 0 01-1 1z" /></svg>
                                Drag and drop your product images or browse your product images
                            </div>
                        </div>
                    </div>
                    <!-- Cột phải -->
                    <div class="space-y-4">
                        <div class="grid  gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Description</label>
                                <input type="text" maxlength="20" class="form-input w-full" placeholder="Description">
                            </div>
                        </div>
                        <div class="grid  gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Tag</label>
                                <input type="text" maxlength="20" class="form-input w-full" placeholder="Tag">
                            </div>
                        </div>
                        <div class="grid  gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Guide</label>
                                <input type="text" maxlength="20" class="form-input w-full" placeholder="Guide">
                            </div>
                        </div>
                        <div class="grid  gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Ingredient</label>
                                <input type="text" maxlength="20" class="form-input w-full" placeholder="Ingredient">
                            </div>
                        </div>
                        <div class="grid gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Category</label>
                                <select class="form-select w-full"><option>Select Category</option></select>
                            </div>
                        </div>
                        <div class="grid gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Supplier</label>
                                <select class="form-select w-full"><option>Select Supplier</option></select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex justify-between items-center mt-6">
                    <div class="flex gap-2">
                        <button type="button" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Add new</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
    <!-- End Content -->

</div>

<div th:replace="admin/fragments/script :: script"></div>

<style>
    .toggle-checkbox {
        right: 0;
        border-color: #6b7280;
    }
    .toggle-checkbox:checked {
        right: 0;
        border-color: #f97316;
    }
    .toggle-checkbox:checked + .toggle-label {
        background-color: #f97316;
    }
    .toggle-label {
        background-color: #6b7280;
        transition: background-color 0.2s ease-in;
    }
</style>

</body>
</html>
