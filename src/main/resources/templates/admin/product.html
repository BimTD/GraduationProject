<!DOCTYPE html>
<html   xmlns:th="http://www.thymeleaf.org"
        lang="en" class="light scroll-smooth group" data-layout="vertical" data-sidebar="light" data-sidebar-size="lg" data-mode="light" data-topbar="light" data-skin="default" data-navbar="sticky" data-content="fluid" dir="ltr">
<head th:replace="~{admin/fragments/head :: head('Product Management')}"></head>

<body class="text-base bg-body-bg text-body font-public dark:text-zink-100 dark:bg-zink-800 group-data-[skin=bordered]:bg-body-bordered group-data-[skin=bordered]:dark:bg-zink-700">
    <div class="group-data-[sidebar-size=sm]:min-h-sm group-data-[sidebar-size=sm]:relative">

        <!-- Sidebar -->
            <div th:replace="~{admin/fragments/sidebar :: sidebar}" ></div>

    <div id="sidebar-overlay" class="absolute inset-0 z-[1002] bg-slate-500/30 hidden"></div>
    <!-- Header -->
    <header th:replace="~{admin/fragments/header :: header}"></header>

        <!-- Content -->
        <div class="group-data-[sidebar-size=lg]:ltr:md:ml-vertical-menu group-data-[sidebar-size=lg]:rtl:md:mr-vertical-menu group-data-[sidebar-size=md]:ltr:ml-vertical-menu-md group-data-[sidebar-size=md]:rtl:mr-vertical-menu-md group-data-[sidebar-size=sm]:ltr:ml-vertical-menu-sm group-data-[sidebar-size=sm]:rtl:mr-vertical-menu-sm pt-[calc(theme('spacing.header')_*_1)] pb-[calc(theme('spacing.header')_*_0.8)] px-4 group-data-[navbar=bordered]:pt-[calc(theme('spacing.header')_*_1.3)] group-data-[navbar=hidden]:pt-0 group-data-[layout=horizontal]:mx-auto group-data-[layout=horizontal]:max-w-screen-2xl group-data-[layout=horizontal]:px-0 group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:ltr:md:ml-auto group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:rtl:md:mr-auto group-data-[layout=horizontal]:md:pt-[calc(theme('spacing.header')_*_1.6)] group-data-[layout=horizontal]:px-3 group-data-[layout=horizontal]:group-data-[navbar=hidden]:pt-[calc(theme('spacing.header')_*_0.9)]">
            <div class="container-fluid group-data-[content=boxed]:max-w-boxed mx-auto">

                <div class="flex flex-col gap-2 py-4 md:flex-row md:items-center print:hidden">
                    <div class="grow">
                        <h5 class="text-16">Product Analytics</h5>
                    </div>
                    <ul class="flex items-center gap-2 text-sm font-normal shrink-0">
                        <li class="relative before:content-['\ea54'] before:font-remix ltr:before:-right-1 rtl:before:-left-1  before:absolute before:text-[18px] before:-top-[3px] ltr:pr-4 rtl:pl-4 before:text-slate-400 dark:text-zink-200">
                            <a href="#!" class="text-slate-400 dark:text-zink-200">Dashboards</a>
                        </li>
                        <li class="text-slate-700 dark:text-zink-100">
                            Product
                        </li>
                    </ul>
                </div>
                <!-- Flash Messages -->
                <div th:if="${success}" class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded">
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
                    <span th:text="${error}"></span>
                </div>
                
                <a  th:href="@{/admin/productForm}" class="btn bg-custom-500 text-white hover:bg-custom-600 transition-all px-4 py-2 rounded">
                    <i data-lucide="plus" class="size-4"></i>
                </a>
                <div class="card" id="productListTable">
                    <div class="card-body">
                        <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 xl:grid-cols-12">
                            <div class="xl:col-span-3">
                                <div class="relative">
                                    <div class="flex gap-2 items-center">
                                        <div class="relative">
                                            <input type="text" id="searchInput" th:value="${search}" class="form-input border-slate-200" placeholder="Search for..." autocomplete="off">
                                            <button type="button" id="searchBtn" class="absolute right-2.5 top-2.5 bg-transparent border-none p-0">
                                                <i data-lucide="search" class="inline-block size-4 text-slate-500 dark:text-zink-200 fill-slate-100 dark:fill-zink-600"></i>
                                            </button>
                                        </div>

                                        <a th:href="@{/admin/product}"
                                           class="btn bg-custom-500 text-white hover:bg-custom-600 transition-all px-4 py-2 rounded">
                                            <i data-lucide="refresh-cw" class="size-4"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Filter by Category -->
                            <div class="xl:col-span-2">
                                <select id="categoryFilter" class="form-input border-slate-200">
                                    <option value="">All Categories</option>
                                    <option th:each="category : ${categories}" 
                                            th:value="${category.id}" 
                                            th:text="${category.ten}"
                                            th:selected="${categoryId == category.id}">
                                    </option>
                                </select>
                            </div>
                            
                            <!-- Filter by Gender -->
                            <div class="xl:col-span-2">
                                <select id="genderFilter" class="form-input border-slate-200">
                                    <option value="">All Genders</option>
                                    <option value="1" th:selected="${gender == '1'}">Nam</option>
                                    <option value="2" th:selected="${gender == '2'}">Nữ</option>
                                    <option value="3" th:selected="${gender == '3'}">Unisex</option>
                                </select>
                            </div>
                            
                            <!-- Filter Button -->
                            <div class="xl:col-span-3">
                                <button id="applyFilter" class="btn bg-custom-500 text-white hover:bg-custom-600 transition-all px-4 py-2 rounded">
                                    <i data-lucide="filter" class="size-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="!pt-1 card-body">
                        <div class="overflow-x-auto">
                            <table class="w-full whitespace-nowrap" id="productTable">
                                <thead class="ltr:text-left rtl:text-right bg-slate-100 dark:bg-zink-600">
                                <tr>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 ID">STT</th>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 Name">Product Name</th>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 Action">Image</th>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 ">Selling Price</th>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 ">Import Price</th>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 ">Status</th>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 ">Brand</th>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 ">Category</th>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 ">Gender</th>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 ">Like Count</th>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 ">Comment Count</th>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 ">Hide/Show</th>
                                    <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500 ">Action</th>
                                </tr>
                                </thead>
                                <tbody class="list">
                                    <tr th:each="product, iterStat : ${products}" class="bg-white dark:bg-zink-700">
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500" th:text="${iterStat.index + 1}"></td>
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500" th:text="${product.ten}"></td>
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500">
                                            <img th:src="${#lists.isEmpty(product.images) ? '/assets/images/no-image.png' : product.images.get(0).imageName}" alt="Ảnh sản phẩm" class="w-12 h-12 object-cover rounded">
                                        </td>
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500" th:text="${#numbers.formatDecimal(product.giaBan, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500" th:text="${#numbers.formatDecimal(product.giaNhap, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500">
                                            <span th:text="${product.trangThaiSanPham}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800"></span>
                                        </td>
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500" th:text="${product.nhanHieu != null ? product.nhanHieu.ten : ''}"></td>
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500" th:text="${product.loai != null ? product.loai.ten : ''}"></td>
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500" th:text="${product.gioiTinh == 1 ? 'Nam' : (product.gioiTinh == 2 ? 'Nữ' : 'Unisex')}"></td>
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500">0</td>
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500">0</td>
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500">
                                            <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                                <input type="checkbox" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" th:checked="${product.trangThaiHoatDong}" th:data-id="${product.id}" onclick="toggleActiveStatus(this)" />
                                                <label class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                                            </div>
                                        </td>
                                        <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-y border-slate-200 dark:border-zink-500 Action">
                                            <div class="flex gap-3">
                                                <a th:href="@{'/admin/product/edit/' + ${product.id}}" class="flex items-center justify-center transition-all duration-150 ease-linear rounded-md size-8 edit-item-btn bg-slate-100 text-slate-500 hover:text-custom-500 hover:bg-custom-100 dark:bg-zink-600 dark:text-zink-200 dark:hover:bg-custom-500/20 dark:hover:text-custom-500"><i data-lucide="pencil" class="size-4"></i></a>
                                                <a th:href="@{'/admin/product/delete/' + ${product.id}}" onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');" class="flex items-center justify-center w-8 h-8 rounded-md bg-red-100 text-red-600 hover:bg-red-600 hover:text-white transition-all duration-150"><i data-lucide="trash-2" class="size-4"></i></a>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(products)}">
                                        <td colspan="14" class="text-center">There are no products.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="flex flex-col items-center gap-4 px-4 mt-4 md:flex-row" id="pagination-element">
                            <div class="grow">
                                <p class="text-slate-500 dark:text-zink-200">
                                    Showing <b th:text="${products.size()}"></b> of <b th:text="${totalElements}"></b> Results
                                </p>
                            </div>
                            <div class="flex items-center gap-2">
                                <form th:action="@{/admin/product}" method="get" class="flex items-center gap-2">
                                    <input type="hidden" name="search" th:value="${search}" />
                                    <input type="hidden" name="categoryId" th:value="${categoryId}" />
                                    <input type="hidden" name="gender" th:value="${gender}" />
                                    <input type="hidden" name="page" th:value="${page}" />

                                    <div class="flex items-center gap-2">
                                        <label for="size" class="whitespace-nowrap">Items per page:</label>
                                        <select name="size" id="size" class="form-input border-slate-200" onchange="this.form.submit()">
                                            <option th:value="5" th:selected="${size == 5}">5</option>
                                            <option th:value="10" th:selected="${size == 10}">10</option>
                                            <option th:value="20" th:selected="${size == 20}">20</option>
                                            <option th:value="50" th:selected="${size == 50}">50</option>
                                        </select>
                                    </div>
                                </form>
                            </div>

                            <div class="col-sm-auto mt-sm-0">
                                <div class="flex gap-2 pagination-wrap justify-content-center">
                                    <a th:href="@{/admin/product(page=${prevPage},size=${size},search=${search},categoryId=${categoryId},gender=${gender})}" th:classappend="${page == 0} ? 'disabled' : ''" class="inline-flex items-center justify-center bg-white dark:bg-zink-700 h-8 px-3 transition-all duration-150 ease-linear border rounded border-slate-200 dark:border-zink-500 text-slate-500 dark:text-zink-200 hover:text-custom-500 dark:hover:text-custom-500 hover:bg-custom-50 dark:hover:bg-custom-500/10 focus:bg-custom-50 dark:focus:bg-custom-500/10 focus:text-custom-500 dark:focus:text-custom-500 page-item pagination-prev">
                                        <i class="mr-1 size-4 rtl:rotate-180" data-lucide="chevron-left"></i> Prev
                                    </a>
                                    <ul class="flex flex-wrap items-center gap-2 pagination">
                                        <li th:each="i : ${#numbers.sequence(0, lastPage)}">
                                            <a th:href="@{/admin/product(page=${i},size=${size},search=${search},categoryId=${categoryId},gender=${gender})}"
                                               th:text="${i+1}"
                                               th:classappend="${i == page} ? 'active bg-custom-50 border-custom-50 text-custom-500' : ''"
                                               class="inline-flex items-center justify-center h-8 px-3 border rounded border-slate-200 dark:border-zink-500 text-slate-500 dark:text-zink-200 hover:text-custom-500 hover:bg-custom-50">
                                            </a>
                                        </li>
                                    </ul>
                                    <a th:href="@{/admin/product(page=${nextPage},size=${size},search=${search},categoryId=${categoryId},gender=${gender})}" th:classappend="${page == lastPage} ? 'disabled' : ''" class="inline-flex items-center justify-center bg-white dark:bg-zink-700 h-8 px-3 transition-all duration-150 ease-linear border rounded border-slate-200 dark:border-zink-500 text-slate-500 dark:text-zink-200 hover:text-custom-500 dark:hover:text-custom-500 hover:bg-custom-50 dark:hover:bg-custom-500/10 focus:bg-custom-50 dark:focus:bg-custom-500/10 focus:text-custom-500 dark:focus:text-custom-500 page-item pagination-next">
                                        Next <i class="ml-1 size-4 rtl:rotate-180" data-lucide="chevron-right"></i>
                                    </a>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
        <!-- End Content -->

    </div>

    <div th:replace="~{admin/fragments/script :: script}"></div>
    <link rel="stylesheet" th:href="@{/assets/css/product-toggle-active.css}" />
    <script th:src="@{/assets/js/product-toggle-active.js}"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const applyFilterBtn = document.getElementById('applyFilter');
            const categoryFilter = document.getElementById('categoryFilter');
            const genderFilter = document.getElementById('genderFilter');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            
            // Function to apply filters and search
            function applyFilters() {
                const searchValue = searchInput ? searchInput.value : '';
                const categoryValue = categoryFilter.value;
                const genderValue = genderFilter.value;
                
                // Build URL with current parameters
                let url = '/admin/product?';
                const params = new URLSearchParams();
                
                // Add search parameter
                if (searchValue && searchValue.trim() !== '') {
                    params.append('search', searchValue.trim());
                }
                
                // Add category parameter
                if (categoryValue && categoryValue !== '') {
                    params.append('categoryId', categoryValue);
                }
                
                // Add gender parameter
                if (genderValue && genderValue !== '') {
                    params.append('gender', genderValue);
                }
                
                // Reset to page 0 when applying filter
                params.append('page', '0');
                params.append('size', '10');
                
                // Navigate to filtered URL
                window.location.href = url + params.toString();
            }
            
            // Apply filter button click
            applyFilterBtn.addEventListener('click', applyFilters);
            
            // Search button click
            searchBtn.addEventListener('click', applyFilters);
            
            // Search input enter key
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    applyFilters();
                }
            });
        });
    </script>
</body>
</html>
