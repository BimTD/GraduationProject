<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="light scroll-smooth group" data-layout="vertical" data-sidebar="light" data-sidebar-size="lg" data-mode="light" data-topbar="light" data-skin="default" data-navbar="sticky" data-content="fluid" dir="ltr">
<head th:replace="~{admin/fragments/head :: head('Chi tiết người dùng')}"></head>

<body class="text-base bg-body-bg text-body font-public dark:text-zink-100 dark:bg-zink-800 group-data-[skin=bordered]:bg-body-bordered group-data-[skin=bordered]:dark:bg-zink-700">
    <div class="group-data-[sidebar-size=sm]:min-h-sm group-data-[sidebar-size=sm]:relative">
        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
        <div id="sidebar-overlay" class="absolute inset-0 z-[1002] bg-slate-500/30 hidden"></div>
        <!-- Header -->
        <header th:replace="~{admin/fragments/header :: header}"></header>

        <!-- Content -->
        <div class="group-data-[sidebar-size=lg]:ltr:md:ml-vertical-menu group-data-[sidebar-size=lg]:rtl:md:mr-vertical-menu group-data-[sidebar-size=md]:ltr:ml-vertical-menu-md group-data-[sidebar-size=md]:rtl:mr-vertical-menu-md group-data-[sidebar-size=sm]:ltr:ml-vertical-menu-sm group-data-[sidebar-size=sm]:rtl:mr-vertical-menu-sm pt-[calc(theme('spacing.header')_*_1)] pb-[calc(theme('spacing.header')_*_0.8)] px-4 group-data-[navbar=bordered]:pt-[calc(theme('spacing.header')_*_1.3)] group-data-[navbar=hidden]:pt-0 group-data-[layout=horizontal]:mx-auto group-data-[layout=horizontal]:max-w-screen-2xl group-data-[layout=horizontal]:px-0 group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:ltr:md:ml-auto group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:rtl:md:mr-auto group-data-[layout=horizontal]:md:pt-[calc(theme('spacing.header')_*_1.6)] group-data-[layout=horizontal]:px-3 group-data-[layout=horizontal]:group-data-[navbar=hidden]:pt-[calc(theme('spacing.header')_*_0.9)]">
            <div class="container-fluid group-data-[content=boxed]:max-w-boxed mx-auto">

                <div class="flex flex-col gap-2 py-4 md:flex-row md:items-center print:hidden">
                    <div class="grow">
                        <h5 class="text-16">Chi tiết người dùng</h5>
                    </div>
                    <ul class="flex items-center gap-2 text-sm font-normal shrink-0">
                        <li class="relative before:content-['\ea54'] before:font-remix ltr:before:-right-1 rtl:before:-left-1 before:absolute before:text-[18px] before:-top-[3px] ltr:pr-4 rtl:pl-4 before:text-slate-400 dark:text-zink-200">
                            <a href="#!" class="text-slate-400 dark:text-zink-200">Tổng quan</a>
                        </li>
                        <li class="text-slate-700 dark:text-zink-100">Chi tiết người dùng</li>
                    </ul>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
                            <div>
                                <h6 class="mb-4 text-15">Thông tin người dùng</h6>
                                <div class="space-y-4">
                                    <div>
                                        <label class="text-slate-500 dark:text-zink-200">ID:</label>
                                        <p class="text-slate-900 dark:text-zink-100" th:text="${user.id}"></p>
                                    </div>
                                    <div>
                                        <label class="text-slate-500 dark:text-zink-200">Tài khoản:</label>
                                        <p class="text-slate-900 dark:text-zink-100" th:text="${user.username}"></p>
                                    </div>
                                    <div>
                                        <label class="text-slate-500 dark:text-zink-200">Email:</label>
                                        <p class="text-slate-900 dark:text-zink-100" th:text="${user.email}"></p>
                                    </div>
                                    <div>
                                        <label class="text-slate-500 dark:text-zink-200">Họ tên:</label>
                                        <p class="text-slate-900 dark:text-zink-100" th:text="${user.hoTen != null ? user.hoTen : 'N/A'}"></p>
                                    </div>
                                    <div>
                                        <label class="text-slate-500 dark:text-zink-200">Số điện thoại:</label>
                                        <p class="text-slate-900 dark:text-zink-100" th:text="${user.soDienThoai != null ? user.soDienThoai : 'N/A'}"></p>
                                    </div>
                                    <div>
                                        <label class="text-slate-500 dark:text-zink-200">Địa chỉ:</label>
                                        <p class="text-slate-900 dark:text-zink-100" th:text="${user.diaChi != null ? user.diaChi : 'N/A'}"></p>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <h6 class="mb-4 text-15">Trạng thái</h6>
                                <div class="space-y-4">
                                    <div>
                                        <label class="text-slate-500 dark:text-zink-200">Phương thức:</label>
                                        <p class="text-slate-900 dark:text-zink-100" th:text="${user.provider != null ? user.provider : 'Local'}"></p>
                                    </div>
                                    <div>
                                        <label class="text-slate-500 dark:text-zink-200">Trạng thái:</label>
                                        <div class="mt-1">
                                            <span th:if="${user.enabled == '1'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Đã bật</span>
                                            <span th:if="${user.enabled == '0'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">Vô hiệu hóa</span>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="text-slate-500 dark:text-zink-200">Hành động:</label>
                                        <div class="mt-2">
                                            <a th:href="@{/admin/user}" class="btn bg-slate-500 text-white hover:bg-slate-600">
                                                <i data-lucide="arrow-left" class="size-4 ltr:mr-1 rtl:ml-1"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div th:replace="~{admin/fragments/script :: script}"></div>
</body>
</html>
