<!DOCTYPE html>
<html   xmlns:th="http://www.thymeleaf.org"
        lang="en" class="light scroll-smooth group" data-layout="vertical" data-sidebar="light" data-sidebar-size="lg" data-mode="light" data-topbar="light" data-skin="default" data-navbar="sticky" data-content="fluid" dir="ltr">
<head th:replace="~{admin/fragments/head :: head('Quản lý sản phẩm biến thể')}"></head>

<body class="text-base bg-body-bg text-body font-public dark:text-zink-100 dark:bg-zink-800 group-data-[skin=bordered]:bg-body-bordered group-data-[skin=bordered]:dark:bg-zink-700">
<div class="group-data-[sidebar-size=sm]:min-h-sm group-data-[sidebar-size=sm]:relative">

    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/sidebar :: sidebar}" ></div>

    <div id="sidebar-overlay" class="absolute inset-0 z-[1002] bg-slate-500/30 hidden"></div>
    <!-- Header -->
    <header th:replace="~{admin/fragments/header :: header}"></header>

    <!-- Content -->
    <div class="group-data-[sidebar-size=lg]:ltr:md:ml-vertical-menu group-data-[sidebar-size=lg]:rtl:md:mr-vertical-menu group-data-[sidebar-size=md]:ltr:ml-vertical-menu-md group-data-[sidebar-size=md]:rtl:mr-vertical-menu-md group-data-[sidebar-size=sm]:ltr:ml-vertical-menu-sm group-data-[sidebar-size=sm]:rtl:mr-vertical-menu-sm pt-[calc(theme('spacing.header')_*_1)] pb-[calc(theme('spacing.header')_*_0.8)] px-4 group-data-[navbar=bordered]:pt-[calc(theme('spacing.header')_*_1.3)] group-data-[navbar=hidden]:pt-0 group-data-[layout=horizontal]:mx-auto group-data-[layout=horizontal]:max-w-screen-2xl group-data-[layout=horizontal]:px-0 group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:ltr:md:ml-auto group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:rtl:md:mr-auto group-data-[layout=horizontal]:md:pt-[calc(theme('spacing.header')_*_1.6)] group-data-[layout=horizontal]:px-3 group-data-[layout=horizontal]:group-data-[navbar=hidden]:pt-[calc(theme('spacing.header')_*_0.9)]">
        <div class="container-fluid group-data-[content=boxed]:max-w-boxed mx-auto">
            <div class="flex flex-col gap-2 py-4 md:flex-row md:items-center print:hidden">
                <div class="grow">
                    <h5 class="text-16">Sản phẩm biến thể</h5>
                </div>
                <ul class="flex items-center gap-2 text-sm font-normal shrink-0">
                    <li class="relative before:content-['\ea54'] before:font-remix ltr:before:-right-1 rtl:before:-left-1  before:absolute before:text-[18px] before:-top-[3px] ltr:pr-4 rtl:pl-4 before:text-slate-400 dark:text-zink-200">
                        <a href="#!" class="text-slate-400 dark:text-zink-200">Tổng quan</a>
                    </li>
                    <li class="text-slate-700 dark:text-zink-100">
                        Sản phẩm biến thể
                    </li>
                </ul>
            </div>

            <!-- Flash Messages -->
            <div th:if="${success}" class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded">
                <div class="whitespace-pre-line" th:text="${success}"></div>
            </div>
            <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
                <span th:text="${error}"></span>
            </div>

            <a th:href="@{/admin/product-variant/add}" class="btn bg-custom-500 text-white hover:bg-custom-600 transition-all px-4 py-2 rounded mb-4">
                <i data-lucide="plus" class="size-4"></i>
            </a>
            
            <a th:href="@{/admin/product-variant/bulk-add}" class="btn bg-green-500 text-white hover:bg-green-600 transition-all px-4 py-2 rounded mb-4 ml-2">
                <i data-lucide="layers" class="size-4"></i>
            </a>

            <div class="card" id="productVariantListTable">
                <div class="card-body">
                    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 xl:grid-cols-12">
                        <div class="xl:col-span-6">
                            <div class="relative">
                                <div class="flex gap-2 items-center">
                                    <div class="relative">
                                        <input type="text" id="searchInput" th:value="${search}" class="form-input border-slate-200" placeholder="Tìm kiếm..." autocomplete="off">
                                        <button type="button" id="searchBtn" class="absolute right-2.5 top-2.5 bg-transparent border-none p-0">
                                            <i data-lucide="search" class="inline-block size-4 text-slate-500 dark:text-zink-200 fill-slate-100 dark:fill-zink-600"></i>
                                        </button>
                                    </div>

                                    <a th:href="@{/admin/product-variant}"
                                       class="btn bg-custom-500 text-white hover:bg-custom-600 transition-all px-4 py-2 rounded">
                                        <i data-lucide="refresh-cw" class="size-4"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="!pt-1 card-body">
                    <div class="overflow-x-auto">
                        <table class="w-full whitespace-nowrap" id="productVariantTable">
                            <thead class="ltr:text-left rtl:text-right bg-slate-100 dark:bg-zink-600">
                            <tr>
                                <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500">STT</th>
                                <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500">Sản phẩm</th>
                                <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500">Màu sắc</th>
                                <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500">Kích cỡ</th>
                                <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500">Số lượng tồn</th>
                                <th class="px-3.5 py-2.5 first:pl-5 last:pr-5 font-semibold border-b border-slate-200 dark:border-zink-500">Hành động</th>
                            </tr>
                            </thead>
                            <tbody class="list">
                            <tr th:each="variant, iterStat : ${variants}" class="bg-white dark:bg-zink-700">
                                <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500" th:text="${iterStat.index + 1}"></td>
                                <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500" th:text="${variant.sanPham.ten}"></td>
                                <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500" th:text="${variant.mauSac.maMau + ' - ' + (variant.mauSac.loai != null ? variant.mauSac.loai.ten : 'N/A')}"></td>
                                <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500" th:text="${variant.size.tenSize + ' - ' + (variant.size.loai != null ? variant.size.loai.ten : 'N/A')}"></td>
                                <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-b border-slate-200 dark:border-zink-500" th:text="${variant.soLuongTon}"></td>
                                <td class="px-3.5 py-2.5 first:pl-5 last:pr-5 border-y border-slate-200 dark:border-zink-500 Action">
                                    <div class="flex gap-3">
                                        <a th:href="@{/admin/product-variant/edit/{id}(id=${variant.id})}"  class="flex items-center justify-center transition-all duration-150 ease-linear rounded-md size-8 edit-item-btn bg-slate-100 text-slate-500 hover:text-custom-500 hover:bg-custom-100 dark:bg-zink-600 dark:text-zink-200 dark:hover:bg-custom-500/20 dark:hover:text-custom-500"><i data-lucide="pencil" class="size-4"></i></a>
                                        <a th:href="@{/admin/product-variant/delete/{id}(id=${variant.id})}"  onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');" class="flex items-center justify-center w-8 h-8 rounded-md bg-red-100 text-red-600 hover:bg-red-600 hover:text-white transition-all duration-150"><i data-lucide="trash-2" class="size-4"></i></a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(variants)}">
                                <td colspan="6" class="px-3.5 py-2.5 text-center border-b border-slate-200 dark:border-zink-500">
                                    Không có!
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="flex flex-col items-center gap-4 px-4 mt-4 md:flex-row" id="pagination-element">
                        <div class="grow">
                            <p class="text-slate-500 dark:text-zink-200">
                                Hiển thị <b th:text="${variants.size()}"></b> trong <b th:text="${totalItems}"></b> kết quả
                            </p>
                        </div>
                        <div class="flex items-center gap-2">
                            <form th:action="@{/admin/product-variant}" method="get" class="flex items-center gap-2">
                                <input type="hidden" name="search" th:value="${search}" />
                                <input type="hidden" name="page" th:value="${currentPageNumber}" />

                                <div class="flex items-center gap-2">
                                    <label for="size" class="whitespace-nowrap">Số lượng mỗi trang:</label>
                                    <select name="size" id="size" class="form-input border-slate-200" onchange="this.form.submit()">
                                        <option th:value="5" th:selected="${size == 5}">5</option>
                                        <option th:value="10" th:selected="${size == 10}">10</option>
                                        <option th:value="20" th:selected="${size == 20}">20</option>
                                        <option th:value="50" th:selected="${size == 50}">50</option>
                                    </select>
                                </div>
                            </form>
                        </div>

                        <div class="col-sm-auto mt-sm-0">
                            <div class="flex gap-2 pagination-wrap justify-content-center">
                                <a th:if="${currentPageNumber > 0}" 
                                   th:href="@{/admin/product-variant(page=${currentPageNumber - 1},size=${size},search=${search})}" 
                                   class="inline-flex items-center justify-center bg-white dark:bg-zink-700 h-8 px-3 transition-all duration-150 ease-linear border rounded border-slate-200 dark:border-zink-500 text-slate-500 dark:text-zink-200 hover:text-custom-500 dark:hover:text-custom-500 hover:bg-custom-50 dark:hover:bg-custom-500/10 focus:bg-custom-50 dark:focus:bg-custom-500/10 focus:text-custom-500 dark:focus:text-custom-500 page-item pagination-prev">
                                    <i class="mr-1 size-4 rtl:rotate-180" data-lucide="chevron-left"></i> Trước
                                </a>

                                <span th:if="${currentPageNumber == 0}" 
                                      class="inline-flex items-center justify-center bg-gray-100 dark:bg-zink-600 h-8 px-3 border rounded border-slate-200 dark:border-zink-500 text-slate-400 dark:text-zink-400 cursor-not-allowed">
                                    <i class="mr-1 size-4 rtl:rotate-180" data-lucide="chevron-left"></i> Trước
                                </span>
                                
                                <ul class="flex flex-wrap items-center gap-2 pagination">
                                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                                        <a th:href="@{/admin/product-variant(page=${i},size=${size},search=${search})}"
                                           th:text="${i+1}"
                                           th:classappend="${i == currentPageNumber} ? 'active bg-custom-50 border-custom-50 text-custom-500' : ''"
                                           class="inline-flex items-center justify-center h-8 px-3 border rounded border-slate-200 dark:border-zink-500 text-slate-500 dark:text-zink-200 hover:text-custom-500 hover:bg-custom-50">
                                        </a>
                                    </li>
                                </ul>

                                <a th:if="${currentPageNumber < totalPages - 1}" 
                                   th:href="@{/admin/product-variant(page=${currentPageNumber + 1},size=${size},search=${search})}" 
                                   class="inline-flex items-center justify-center bg-white dark:bg-zink-700 h-8 px-3 transition-all duration-150 ease-linear border rounded border-slate-200 dark:border-zink-500 text-slate-500 dark:text-zink-200 hover:text-custom-500 dark:hover:text-custom-500 hover:bg-custom-50 dark:hover:bg-custom-500/10 focus:bg-custom-50 dark:focus:bg-custom-500/10 focus:text-custom-500 dark:focus:text-custom-500 page-item pagination-next">
                                    Sau <i class="ml-1 size-4 rtl:rotate-180" data-lucide="chevron-right"></i>
                                </a>

                                <span th:if="${currentPageNumber == totalPages - 1}" 
                                      class="inline-flex items-center justify-center bg-gray-100 dark:bg-zink-600 h-8 px-3 border rounded border-slate-200 dark:border-zink-500 text-slate-400 dark:text-zink-400 cursor-not-allowed">
                                    Sau <i class="ml-1 size-4 rtl:rotate-180" data-lucide="chevron-right"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{admin/fragments/script :: script}"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Search functionality
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');

    function performSearch() {
        const searchTerm = searchInput.value.trim();
        const currentUrl = new URL(window.location);
        currentUrl.searchParams.set('search', searchTerm);
        currentUrl.searchParams.set('page', '0');
        window.location.href = currentUrl.toString();
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            performSearch();
        }
    });
});
</script>
</body>
</html>
